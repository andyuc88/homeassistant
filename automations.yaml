- id: '1774200390748'
  alias: 'Safety: Water Leak Detection'
  description: Notifies if water flow is high for too long or never hits zero.
  triggers:
  - entity_id: sensor.water_flow_rate
    above: 5
    for:
      minutes: 30
    id: high_flow
    trigger: numeric_state
  - entity_id: sensor.water_flow_rate
    above: 0.1
    for:
      hours: 3
    id: continuous_flow
    trigger: numeric_state
  actions:
  - action: notify.mobile_app_andys_iphone
    data:
      message: Water leak!
      title: Water leak
  mode: restart
