- id: '1736105608982'
  alias: NFC Reader - Plex
  description: Plays Plex movies when NFC tags are scanned
  triggers:
  - event_type: tag_scanned
    trigger: event
  conditions: []
  actions:
  - variables:
      NFC_MAPPING:
        07-B6-3D-02:
          name: Frozen
          plex_id: 2535
        04-D1-BF-50-24-02-89:
          name: Moana
          plex_id: 2566
  - if:
    - condition: template
      value_template: '{{ trigger.event.data.tag_id in NFC_MAPPING }}'
    then:
    - if:
      - condition: state
        entity_id: media_player.living_room_atv
        state: idle
      then:
      - target:
          entity_id: media_player.living_room_atv
        action: media_player.turn_on
        data: {}
      - delay:
          seconds: 5
    - if:
      - condition: template
        value_template: '{{ ''plex_id'' in NFC_MAPPING[trigger.event.data.tag_id]
          }}'
      then:
      - target:
          entity_id: media_player.living_room_atv
        data:
          media_content_type: url
          media_content_id: "plex://play/?metadataKey=%2Flibrary%2Fmetadata%2F{{ \n
            \ NFC_MAPPING[trigger.event.data.tag_id].plex_id \n}}&server=14b5b275400fbfa3ba1703a42012d2de1d719121"
        action: media_player.play_media
  mode: single
